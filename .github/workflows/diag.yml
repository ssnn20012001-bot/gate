name: Worker Reachability Diag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: DNS resolution
        run: |
          for h in vpngate-check.ssnn20012001.workers.dev workers.dev check.helei.kdns.fr; do
            echo "--- $h"
            getent hosts "$h" || echo "  (getent: no result)"
          done

      - name: Raw curl with verbose
        run: |
          echo "=== ROOT ==="
          curl -sS -v --max-time 30 https://vpngate-check.ssnn20012001.workers.dev/ 2>&1 | tail -40 || echo "curl exit=$?"
          echo
          echo "=== /check (real VPN Gate SSTP node) ==="
          curl -sS -v --max-time 60 \
            'https://vpngate-check.ssnn20012001.workers.dev/check?sstp=vpn%3Avpn%40vpn524454050.opengw.net%3A1701' 2>&1 | tail -60 || echo "curl exit=$?"

      - name: Status-code matrix
        run: |
          probe() {
            printf '%-70s ' "$1"
            curl -sS -o /tmp/body.txt -w 'http=%{http_code} time=%{time_total}s size=%{size_download}\n' --max-time 45 "$1" || echo "curl exit=$?"
            echo "    body(first 300): $(head -c 300 /tmp/body.txt 2>/dev/null)"
          }
          probe 'https://vpngate-check.ssnn20012001.workers.dev/'
          probe 'https://vpngate-check.ssnn20012001.workers.dev/check?sstp=vpn%3Avpn%40vpn524454050.opengw.net%3A1701'
          probe 'https://check.helei.kdns.fr/check?sstp=vpn%3Avpn%40vpn524454050.opengw.net%3A1701'
          probe 'https://api.cloudflare.com/client/v4/user/tokens/verify'
          probe 'https://example.com/'